# Builds every release on GitHub's own runners, straight from the tagged
# source - so the GameScheduler.exe people download is demonstrably built
# from the code in this repository, not from someone's laptop. The release
# notes carry the commit it was built from, SHA-256 checksums, and (when a
# VirusTotal API key is configured as the VT_API_KEY secret) a scan link.
#
# To cut a release: bump package.json, write RELEASE_NOTES.md, then
#   git tag -a v1.2.3 -m v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: |
          npm run csv:test
          npm run autogen:test
          npm run report:test
          npm run roundbuilder:test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pywebview pythonnet pywin32
      - name: Build GameScheduler.exe
        run: pyinstaller --onefile --noconsole --name GameScheduler --icon app_icon.ico launcher.py

      - name: Package release ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Everything tracked in git (node_modules is committed, so this is a
          # complete install; .gitattributes export-ignore trims dev-only files)
          git archive --format=zip --prefix=GameScheduler/ -o source.zip HEAD
          7z x source.zip -ostaging | Out-Null
          Copy-Item dist\GameScheduler.exe staging\GameScheduler\GameScheduler.exe
          7z a -tzip "GameScheduler-$tag.zip" .\staging\GameScheduler | Out-Null
          $lines = @()
          foreach ($f in @("GameScheduler-$tag.zip", "dist\GameScheduler.exe")) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: VirusTotal scan
        id: vt
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          files: dist/GameScheduler.exe

      - name: Write release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $body = @()
          if (Test-Path RELEASE_NOTES.md) { $body += Get-Content RELEASE_NOTES.md -Raw }
          $body += ""
          $body += "## Verify this download"
          $body += ""
          $body += "Built by GitHub Actions from commit [``${{ github.sha }}``](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) - see the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          $body += ""
          $body += "SHA-256:"
          $body += '```'
          $body += (Get-Content SHA256SUMS.txt)
          $body += '```'
          $vt = "${{ steps.vt.outputs.analysis }}"
          if ($vt) {
            $url = ($vt -split ',')[0] -replace '^[^=]*=', ''
            $body += ""
            $body += "VirusTotal scan of GameScheduler.exe: $url"
            $body += ""
            $body += "_A handful of detections on a PyInstaller-built exe are a known false positive for that packaging tool - the point of the link is that you can see the result yourself, and re-scan the file you actually downloaded._"
          }
          $body -join "`n" | Set-Content release-body.md -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "GameScheduler-$tag.zip" SHA256SUMS.txt --title $tag --notes-file release-body.md
