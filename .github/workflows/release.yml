# Publishes every release on GitHub's own runners, straight from the tagged
# source - the ZIP people download is demonstrably the code in this
# repository. There is nothing to compile: the app is plain Node.js and
# opens in the Edge/Chrome already on the machine (see launcher.js), so the
# ZIP is simply `git archive` of the tag. The release notes carry the
# commit, a SHA-256 checksum, and (when a VirusTotal API key is configured
# as the VT_API_KEY secret) a scan link.
#
# To cut a release: bump package.json, write RELEASE_NOTES.md, then
#   git tag -a v1.2.3 -m v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: |
          npm run csv:test
          npm run autogen:test
          npm run report:test
          npm run roundbuilder:test
          node --check launcher.js

      - name: Package release ZIP
        run: |
          tag="${{ github.ref_name }}"
          # Everything tracked in git (node_modules is committed, so this is a
          # complete install; .gitattributes export-ignore trims dev-only files)
          git archive --format=zip --prefix=GameScheduler/ -o "GameScheduler-$tag.zip" HEAD
          sha256sum "GameScheduler-$tag.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: VirusTotal scan
        id: vt
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          files: GameScheduler-${{ github.ref_name }}.zip

      - name: Write release notes
        run: |
          {
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; fi
            echo
            echo "## Verify this download"
            echo
            echo "Built by GitHub Actions from commit [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) - see the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}). The ZIP is the tagged source exactly as you can read it here - there is no compiled executable in it."
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            vt="${{ steps.vt.outputs.analysis }}"
            if [ -n "$vt" ]; then
              url="${vt#*=}"; url="${url%%,*}"
              echo
              echo "VirusTotal scan of the ZIP: $url"
            fi
          } > release-body.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" "GameScheduler-$tag.zip" SHA256SUMS.txt --title "$tag" --notes-file release-body.md
