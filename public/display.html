<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display - Game Scheduler</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<style>
/* Kiosk-only styling: dark, large type, readable from across a hall.
   Deliberately not sharing style.css - this screen has no controls and a
   completely different visual job to the staff pages. */
:root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --game: #4ade80;
    --break: #fbbf24;
    --waiting: #f87171;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    padding: 2vmin;
    overflow: hidden;
}
/* Everything (header, banner, courts+resting row) fits one viewport, no
   scrolling - this is a wall-mounted TV screen, not something anyone scrolls. */
#live-screen {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
}
.main-layout {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 1.6vmin;
}
header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    flex-wrap: wrap;
    gap: 1vmin;
    margin-bottom: 2vmin;
}
h1 { font-size: 3.4vmin; margin: 0; }
.timer-block { text-align: right; }
.wall-clock {
    font-size: 2vmin;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-bottom: 0.6vmin;
}
.phase-label {
    font-size: 2vmin;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
}
.phase-label.game { color: var(--game); }
.phase-label.break { color: var(--break); }
.phase-label.awaiting_lineup { color: var(--waiting); }
#countdown {
    font-size: 7vmin;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
}
#countdown.urgent { color: var(--waiting); }
#countdown.clear-now {
    color: var(--bg);
    background: var(--waiting);
    border-radius: 1vmin;
    padding: 0 0.4vmin;
    animation: pulse-banner 0.6s ease-in-out infinite;
}
.next-match-line {
    font-size: 1.9vmin;
    color: var(--muted);
    margin-top: 0.8vmin;
}
.next-match-line strong {
    color: var(--text);
    font-variant-numeric: tabular-nums;
}
.warning-banner {
    background: var(--waiting);
    color: var(--bg);
    text-align: center;
    font-size: 2.8vmin;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 1.2vmin;
    border-radius: 1vmin;
    margin-bottom: 1.6vmin;
    animation: pulse-banner 1s ease-in-out infinite;
}
@keyframes pulse-banner {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
.courts {
    flex: 3;
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: 2vmin;
    overflow-y: auto;
}
.court {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 1.2vmin;
    padding: 2.6vmin 2vmin;
    display: flex;
    flex-direction: column;
    min-width: 0;
}
/* Sized to be read at a glance from across a room - court number and player
   names are what a crowd needs to find fast, so they're the biggest text on
   the whole screen. Names that are too long to fit truncate with an ellipsis
   rather than wrapping - a uniform grid reads faster than a taller row. */
.court h2 {
    margin: 0 0 1.6vmin;
    font-size: 4.6vmin;
    font-weight: 800;
    color: var(--accent);
}
.court .team {
    display: flex;
    flex-direction: column;
    gap: 0.7vmin;
    margin-bottom: 4.4vmin;
    min-width: 0;
}
.court .team:last-child { margin-bottom: 0; }
.court .team .player-name {
    font-size: 3.4vmin;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.court.free { display: flex; align-items: center; justify-content: center; min-height: 16vmin; }
.court.free span { color: var(--muted); font-size: 3vmin; text-transform: uppercase; letter-spacing: 0.1em; }
.waiting-panel {
    flex: 1;
    min-width: 18vmin;
    max-width: 30vmin;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 1.2vmin;
    padding: 1.6vmin;
    display: flex;
    flex-direction: column;
    min-height: 0;
}
.waiting-panel h2 { margin: 0 0 1.2vmin; font-size: 2.4vmin; flex-shrink: 0; }
.waiting-panel h2 .count { color: var(--muted); font-weight: 400; }
/* Single column - one player per row, top to bottom. At typical resting
   counts this fits the panel with no scrolling at all (verified at
   1920x1080); overflow-y is a graceful fallback for an unusually packed
   night, so only this list scrolls rather than the whole screen. */
.waiting-list {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6vmin;
    overflow-y: auto;
}
.waiting-player {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0.9vmin;
    padding: 0.6vmin 1vmin;
    font-size: 2.2vmin;
    font-weight: 600;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#idle-screen {
    display: none;
    text-align: center;
    padding-top: 30vh;
}
#idle-screen h1 { font-size: 5vmin; }
#idle-screen p { color: var(--muted); font-size: 2.4vmin; }
</style>
</head>
<body>
<div id="idle-screen">
    <h1>No session in progress</h1>
</div>

<div id="live-screen" style="display:none;">
    <header>
        <div class="timer-block">
            <div class="wall-clock" id="wall-clock"></div>
            <div class="phase-label" id="phase-label"></div>
            <div id="countdown"></div>
            <div class="next-match-line" id="next-match-line" style="display:none;"></div>
        </div>
    </header>

    <div class="warning-banner" id="warning-banner" style="display:none;"></div>

    <div class="main-layout">
        <div class="courts" id="courts"></div>

        <div class="waiting-panel">
            <h2>Resting <span class="count" id="waiting-count"></span></h2>
            <div class="waiting-list" id="waiting-list"></div>
        </div>
    </div>
</div>

<script src="/events.js"></script>
<script src="/display.js"></script>
<script src="/pwa.js"></script>
</body>
</html>
